
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON KAÇIŞ 5.0</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
  color: white;
}

canvas { display:block; }

#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  font-size: 14px;
  display: block;
}
</style>
</head>

<body>

<div id="ui">Yükleniyor...</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let player, obs, coins;
let score = 0;
let level = 1;
let speed = 6;
let name = prompt("İsmini yaz") || "Player";

function init(){
  player = {x:canvas.width/2,y:canvas.height-120,w:40,h:40};
  obs = [];
  coins = [];
  score = 0;
  level = 1;
  speed = 6;
}

function spawn(){
  obs.push({
    x:Math.random()*canvas.width,
    y:-50,w:40,h:40,speed
  });

  coins.push({
    x:Math.random()*canvas.width,
    y:-50,r:10,speed
  });
}

setInterval(()=>spawn(),700);

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ffff";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle="red";
  obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));

  ctx.fillStyle="gold";
  coins.forEach(c=>{
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.fill();
  });
}

function update(){
  score++;

  if(score%400===0){
    level++;
    speed++;
  }

  obs.forEach(o=>{
    o.y+=o.speed;

    if(
      player.x<o.x+o.w &&
      player.x+player.w>o.x &&
      player.y<o.y+o.h &&
      player.y+player.h>o.y
    ){
      alert("Bitti! Skor: "+score);
      location.reload();
    }
  });

  coins.forEach((c,i)=>{
    c.y+=c.speed;

    if(Math.hypot(player.x-c.x,player.y-c.y)<25){
      score+=10;
      coins.splice(i,1);
    }
  });

  obs = obs.filter(o=>o.y<canvas.height+100);
  coins = coins.filter(c=>c.y<canvas.height+100);

  document.getElementById("ui").innerText =
    name+" | Skor:"+score+" | Level:"+level;
}

function move(dir){
  if(dir==="l") player.x-=30;
  if(dir==="r") player.x+=30;
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") move("l");
  if(e.key==="ArrowRight") move("r");
});

document.addEventListener("touchstart",e=>{
  let x=e.touches[0].clientX;
  if(x<innerWidth/2) move("l");
  else move("r");
});

function loop(){
  draw();
  update();
  requestAnimationFrame(loop);
}

init();
loop();
</script>

</body>
</html>
